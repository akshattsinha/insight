services:

  insight:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: insight
    env_file:
      - .env
    ports:
      - "8080:8080"
    volumes:
      - .:/app
    command: uvicorn src.main:app --host 0.0.0.0 --port 8080

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: insight-dashboard
    env_file:
      - .env
    ports:
      - "8502:8502"
    volumes:
      - .:/app
    command: streamlit run src/dashboard.py --server.address=0.0.0.0 --server.port=8502